<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aarti & Bhajans - Spiritual Tracker</title>

    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Crimson+Pro:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            /* Default Theme: Kailash Dark */
            --bg-grad: linear-gradient(135deg, #00101a 0%, #012a4a 50%, #01497c 100%);
            --glass: rgba(255, 255, 255, 0.12);
            --glow-color: rgba(225, 245, 254, 0.4);
            --accent: #ffffff;
            --text-color: #e1f5fe;
            --p: #00b4d8;
            --s: #90e0ef;
        }

        .light-mode {
            --glass: rgba(0, 0, 0, 0.05);
            --text-color: #2c3e50;
            --glow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
            transition: 0.5s ease;
            overflow-x: hidden;
        }

        .top-row {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: center;
        }

        .back-btn {
            background: var(--glass);
            border: 1px solid var(--p);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }

        .theme-toggle {
            background: var(--glass);
            border: none;
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .in-box {
            flex: 1;
            padding: 14px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--p), var(--s));
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 1rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .search-btn:active {
            transform: scale(0.95);
        }

        .results-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 120px; /* Leave space for player card */
        }

        .aarti-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .aarti-card:hover {
            transform: translateY(-2px);
            border-color: var(--p);
        }

        .aarti-thumb {
            width: 90px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .aarti-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .aarti-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--accent);
        }

        .aarti-duration {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .play-card-btn {
            background: var(--p);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.2s;
        }

        .play-card-btn:active {
            transform: scale(0.9);
        }

        /* Loading spinner */
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--p);
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Floating Player Card */
        .player-card {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 470px;
            background: rgba(1, 26, 44, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            z-index: 1000;
            display: none; /* Initially hidden */
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .player-body {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Animated Diya (Lamp) or Disc */
        .disc-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .spinning-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #ff9800 20%, #ef6c00 60%, #3e2723 100%);
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px var(--glow-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            animation: spinDisc 3s linear infinite paused;
        }

        .spinning-disc.playing {
            animation-play-state: running;
        }

        @keyframes spinDisc {
            100% { transform: rotate(360deg); }
        }

        .player-info {
            flex: 1;
            text-align: left;
            overflow: hidden;
        }

        .player-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--accent);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
            outline: none;
        }

        .progress-filled {
            height: 100%;
            width: 0%;
            background: var(--p);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--p);
        }

        /* Hidden YT Iframe container (Must be minimal size to obey YT policies) */
        #yt-player-container {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 200px;
            height: 200px;
        }

        /* Theme buttons */
        .quick-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .tag-btn {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .tag-btn:hover {
            border-color: var(--p);
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>

<body>

    <div class="top-row">
        <a href="/" class="back-btn">← Home</a>
        <h2 style="font-family:'Crimson Pro', serif; margin: 0; font-size: 1.5rem; color: var(--p);">Spiritual Player</h2>
        <button class="theme-toggle" onclick="toggleMode()" id="mode-icon">🌙</button>
    </div>

    <div class="glass-card">
        <h1 style="font-family:'Crimson Pro', serif; font-size: 2.2rem; margin: 0 0 10px 0; color: var(--p);">🌸 Aarti & Bhajans 🌸</h1>
        <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 20px;">તમારી મનગમતી આરતી કે ભજન સર્ચ કરીને સાંભળો</p>
        
        <div class="search-row">
            <input type="text" id="search-input" class="in-box" placeholder="દા.ત. Ganesh Aarti, Hanuman Chalisa..." onkeypress="handleKeyPress(event)">
            <button class="search-btn" onclick="performSearch()">Search</button>
        </div>

        <div class="quick-tags">
            <button class="tag-btn" onclick="quickSearch('Ganesh Aarti')">🪔 Ganesh Aarti</button>
            <button class="tag-btn" onclick="quickSearch('Hanuman Chalisa')">🐒 Hanuman Chalisa</button>
            <button class="tag-btn" onclick="quickSearch('Shiv Aarti')">🔱 Shiv Aarti</button>
            <button class="tag-btn" onclick="quickSearch('Ram Bhajan')">🏹 Ram Bhajan</button>
        </div>
    </div>

    <!-- Spinner -->
    <div class="spinner" id="loading-spinner"></div>

    <!-- Search Results -->
    <div class="results-container" id="results-grid">
        <!-- Results will be injected dynamically -->
        <p style="text-align: center; opacity: 0.5; font-size: 0.9rem; margin-top: 20px;">કોઈ આરતી સર્ચ કરો...</p>
    </div>

    <!-- Floating Audio Player Card -->
    <div class="player-card" id="player-container">
        <div class="player-body">
            <div class="disc-wrapper">
                <div class="spinning-disc" id="player-disc">🪔</div>
            </div>
            
            <div class="player-info">
                <div class="player-title" id="current-title">Playing Aarti...</div>
                <div class="player-controls">
                    <button class="control-btn" onclick="togglePlay()" id="play-btn">⏸️</button>
                    
                    <!-- Volume control slider -->
                    <span style="font-size: 0.9rem; margin-left: 10px;">🔊</span>
                    <input type="range" min="0" max="100" value="50" style="width: 70px; height: 3px; accent-color: var(--p);" oninput="changeVolume(this.value)">
                </div>
            </div>
        </div>
        
        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar" onclick="seekVideo(event)" id="prog-bar-track">
                <div class="progress-filled" id="prog-filled"></div>
            </div>
            <span id="time-total">0:00</span>
        </div>
    </div>

    <!-- Hidden YouTube Player Iframe -->
    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        let player = null;
        let isPlayerReady = false;
        let progressInterval = null;
        let activeTheme = 'kailash';

        // Initialize YouTube Player API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '200',
                width: '200',
                videoId: '',
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
        }

        function onPlayerStateChange(event) {
            const disc = document.getElementById('player-disc');
            const playBtn = document.getElementById('play-btn');

            if (event.data === YT.PlayerState.PLAYING) {
                disc.classList.add('playing');
                playBtn.innerText = "⏸️";
                startProgressTracker();
            } else {
                disc.classList.remove('playing');
                playBtn.innerText = "▶️";
                stopProgressTracker();
            }
        }

        // Initialize theme on load
        window.onload = () => {
            // Apply Dark/Light mode
            const isDark = localStorage.getItem('darkMode') !== 'false';
            if (!isDark) {
                document.body.classList.add('light-mode');
                document.getElementById('mode-icon').innerText = "☀️";
            }
            
            // Sync theme variables
            setTheme(activeTheme);
        };

        function toggleMode() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('darkMode', !isLight);
            document.getElementById('mode-icon').innerText = isLight ? "☀️" : "🌙";
            setTheme(activeTheme);
        }

        function setTheme(t) {
            activeTheme = t;
            const isLight = document.body.classList.contains('light-mode');
            const root = document.documentElement;

            if (isLight) {
                root.style.setProperty('--p', '#0077b6');
                root.style.setProperty('--bg-grad', 'linear-gradient(135deg, #e0f2f1 0%, #b2ebf2 100%)');
            } else {
                root.style.setProperty('--p', '#00b4d8');
                root.style.setProperty('--bg-grad', 'linear-gradient(135deg, #00101a 0%, #012a4a 50%, #01497c 100%)');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        function quickSearch(tag) {
            document.getElementById('search-input').value = tag;
            performSearch();
        }

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const spinner = document.getElementById('loading-spinner');
            const grid = document.getElementById('results-grid');

            spinner.style.display = 'block';
            grid.innerHTML = '';

            try {
                const response = await fetch(`/api/search_aarti?q=${encodeURIComponent(query)}`);
                const results = await response.json();

                spinner.style.display = 'none';

                if (!results || results.length === 0) {
                    grid.innerHTML = `<p style="text-align: center; opacity: 0.5; margin-top: 20px;">કોઈ પરિણામો ન મળ્યા.</p>`;
                    return;
                }

                results.forEach(video => {
                    grid.innerHTML += `
                        <div class="aarti-card">
                            <img class="aarti-thumb" src="${video.thumbnailUrl}" alt="Thumbnail">
                            <div class="aarti-info">
                                <h4 class="aarti-title">${video.title}</h4>
                                <span class="aarti-duration">⏱️ ${video.duration}</span>
                            </div>
                            <button class="play-card-btn" onclick="playAarti('${video.videoId}', '${escapeHtml(video.title)}')">▶️</button>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Search error:", err);
                spinner.style.display = 'none';
                grid.innerHTML = `<p style="text-align: center; color: #ef4444; margin-top: 20px;">સર્ચ કનેક્શન એરર. પ્લીઝ ફરી ટ્રાય કરો.</p>`;
            }
        }

        function playAarti(videoId, title) {
            if (!isPlayerReady || !player) {
                alert("પ્લેયર હજુ રેડી થઈ રહ્યું છે. પ્લીઝ ૨ સેકન્ડ રાહ જુઓ.");
                return;
            }

            // Display floating player card
            document.getElementById('player-container').style.display = 'block';
            document.getElementById('current-title').innerText = title;

            // Load and play video
            player.loadVideoById(videoId);
            player.playVideo();
        }

        function togglePlay() {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function changeVolume(vol) {
            if (player && isPlayerReady) {
                player.setVolume(vol);
            }
        }

        function seekVideo(e) {
            if (!player || !isPlayerReady) return;
            const track = document.getElementById('prog-bar-track');
            const rect = track.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            const totalDuration = player.getDuration();
            
            if (totalDuration) {
                const targetTime = clickPosition * totalDuration;
                player.seekTo(targetTime, true);
            }
        }

        function startProgressTracker() {
            stopProgressTracker();
            progressInterval = setInterval(() => {
                if (!player || !isPlayerReady) return;
                
                const current = player.getCurrentTime();
                const total = player.getDuration();
                
                if (total) {
                    const percentage = (current / total) * 100;
                    document.getElementById('prog-filled').style.width = percentage + "%";
                    
                    document.getElementById('time-current').innerText = formatTime(current);
                    document.getElementById('time-total').innerText = formatTime(total);
                }
            }, 1000);
        }

        function stopProgressTracker() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>

</html>
